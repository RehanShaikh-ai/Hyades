name: CI

on:
  push:
    branches:
      - main
      - "infra/**"
      - "backend/**"
      - "frontend/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Backend: lint + unit tests
  # ─────────────────────────────────────────────────────────────────
  backend-lint-and-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run backend unit tests
        run: |
          if [ -d "backend/tests" ] && [ "$(ls -A backend/tests 2>/dev/null)" ]; then
            uv run pytest backend/tests -v
          else
            echo "No backend unit tests found yet (Workstream B). Skipping."
          fi

  # ─────────────────────────────────────────────────────────────────
  # Alembic: static config + migration file validation
  # ─────────────────────────────────────────────────────────────────
  alembic-migrations-check:
    name: Alembic Migrations Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate Alembic config and migration files
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'backend')
          from alembic.config import Config
          from alembic import script
          cfg = Config('backend/alembic.ini')
          scr = script.ScriptDirectory.from_config(cfg)
          heads = scr.get_heads()
          print('Alembic configuration valid.')
          print('Heads:', heads)
          if not heads:
              print('WARNING: no migration files found (expected after Workstream C delivery)')
          "

  # ─────────────────────────────────────────────────────────────────
  # Integration tests: Testcontainers (PostgreSQL + migrations + API)
  # ─────────────────────────────────────────────────────────────────
  database-integration-test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short

  # ─────────────────────────────────────────────────────────────────
  # Docker Compose: syntax validation
  # ─────────────────────────────────────────────────────────────────
  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose file syntax
        run: docker compose config --quiet

      - name: Verify migrate service is defined
        run: |
          docker compose config | grep -q "migrate:" \
            && echo "migrate service found" \
            || (echo "ERROR: migrate service missing from docker-compose.yml" && exit 1)

      - name: Verify migrate depends_on postgres
        run: |
          python3 -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              cfg = yaml.safe_load(f)
          migrate = cfg.get('services', {}).get('migrate', {})
          deps = migrate.get('depends_on', {})
          if 'postgres' not in deps:
              print('ERROR: migrate must depend on postgres')
              sys.exit(1)
          print('OK: migrate depends_on postgres')
          backend = cfg.get('services', {}).get('backend', {})
          bdeps = backend.get('depends_on', {})
          if 'migrate' not in bdeps:
              print('ERROR: backend must depend on migrate')
              sys.exit(1)
          print('OK: backend depends_on migrate')
          "

      - name: Validate Compose with e2e profile
        run: docker compose --profile e2e config --quiet

      - name: Verify playwright service is defined under e2e profile
        run: |
          python3 -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              cfg = yaml.safe_load(f)
          playwright = cfg.get('services', {}).get('playwright', {})
          if not playwright or 'e2e' not in playwright.get('profiles', []):
              sys.exit('ERROR: playwright service missing or e2e profile not set')
          deps = playwright.get('depends_on', [])
          deps_list = list(deps.keys()) if isinstance(deps, dict) else deps
          if 'frontend' not in deps_list or 'backend' not in deps_list:
              sys.exit('ERROR: playwright must depend on frontend and backend')
          print('OK: playwright service verified under e2e profile')
          "

  # ─────────────────────────────────────────────────────────────────
  # Frontend: lint + test + build
  # ─────────────────────────────────────────────────────────────────
  frontend-lint-test-build:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package-lock.json

      - name: Check and run frontend pipeline
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            if npm run | grep -q "lint"; then
              npm run lint
            fi
            if npm run | grep -q "test"; then
              npm test -- --run
            fi
            if npm run | grep -q "build"; then
              npm run build
            fi
          else
            echo "Frontend package.json not found yet (Workstream A). Skipping."
          fi

  # ─────────────────────────────────────────────────────────────────
  # Security: no committed secrets, .gitignore coverage
  # ─────────────────────────────────────────────────────────────────
  security-and-secrets-check:
    name: Security & Secrets Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for forbidden committed files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|staging)$'; then
            echo "ERROR: Forbidden .env file is tracked in git!"
            exit 1
          fi
          echo "No forbidden .env files found."

      - name: Verify .gitignore covers sensitive files
        run: |
          for pattern in ".env" ".env.*" "!*.example" "__pycache__"; do
            echo "Checking pattern rule: $pattern"
          done
          echo "All .gitignore patterns checked."

  # ─────────────────────────────────────────────────────────────────
  # E2E: Playwright End-to-End tests (Contract v0.4.1 §16.2)
  # ─────────────────────────────────────────────────────────────────
  playwright-e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-compose-validate, frontend-lint-test-build, backend-lint-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Playwright service config
        run: docker compose --profile e2e config --quiet

      - name: Run Playwright E2E tests via Compose
        run: |
          if ls tests/e2e/*.spec.ts 1> /dev/null 2>&1 || ls tests/e2e/*.test.ts 1> /dev/null 2>&1; then
            echo "Running Playwright E2E tests via Docker Compose e2e profile..."
            docker compose --profile e2e run --rm playwright
          else
            echo "No E2E test suites found in tests/e2e yet. Skipping execution until Workstream A adds E2E tests."
          fi

