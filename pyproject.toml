[project]
name = "collaborative-second-brain-backend"
version = "0.4.2"
description = "Hyades - Celestial Knowledge Observatory & Archival Research Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Hyades Contributors" }
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.15,<2.0",
    # Source ingestion
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<7.0",
    # v0.3.1 — Vector store, job queue, embeddings (CONTRACT §4)
    "qdrant-client>=1.9.0,<2.0",
    "arq>=0.26.0,<1.0",
    "redis>=5.0.0,<6.0",
    "fastembed>=0.8.1",
    "beautifulsoup4>=4.15.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "testcontainers[postgres]>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
